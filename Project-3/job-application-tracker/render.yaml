databases:
  - name: job-application-tracker-db
    databaseName: job_application_tracker
    user: job_application_tracker
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: job-application-tracker
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-application-tracker-db
          property: connectionString
